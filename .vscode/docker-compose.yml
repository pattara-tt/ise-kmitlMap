
# SciMap — PostgreSQL / Migration / Backend / Frontend

services:
  # ── PostgreSQL ──────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: scimap-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kmitlmap}
      POSTGRES_USER: ${POSTGRES_USER:-kmitlmap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ต้องกำหนด POSTGRES_PASSWORD ในไฟล์ .env}
      LANG: C.UTF-8
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    networks: [scimap]
    expose: ["5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kmitlmap} -d ${POSTGRES_DB:-kmitlmap}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Database Migration ─────────────────────────────────────
  migrate:
    image: postgres:16-alpine
    restart: "no"
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-kmitlmap}
      PGDATABASE: ${POSTGRES_DB:-kmitlmap}
      PGPASSWORD: ${POSTGRES_PASSWORD:?ต้องกำหนด POSTGRES_PASSWORD ในไฟล์ .env}
    volumes:
      - ./db/migrations/002_event_room_type_override.sql:/migrations/002_event_room_type_override.sql:ro
    entrypoint: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/migrations/002_event_room_type_override.sql"]
    depends_on:
      db:
        condition: service_healthy
    networks: [scimap]

  # ── Backend API (Express) ───────────────────────────────────
  backend:
    build:
      context: ./backend
    container_name: scimap-backend
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-kmitlmap}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-kmitlmap}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-30}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [scimap]
    expose: ["4000"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Frontend (Next.js) ──────────────────────────────────────
  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_CARTO_BASEMAP_KEY: ${CARTO_BASEMAP_KEY:-}
    container_name: scimap-frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:4000
      PORT: 3000
    depends_on:
      backend:
        condition: service_healthy
    networks: [scimap]
    ports:
      - "80:3000"

volumes:
  db_data:

networks:
  scimap:
    driver: bridge
