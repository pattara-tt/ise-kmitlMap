name: Deploy

# Continuous Deployment: เมื่อ CI ของ push เข้า branch production ผ่านครบ จะ deploy ขึ้น VM ให้อัตโนมัติ
# branch production ตอนนี้คือ refactor (branch ที่ VM ใช้อยู่) ถ้าย้ายไป main ให้แก้ทั้ง branches และ if ด้านล่าง
# กดรันเองได้ที่แท็บ Actions → Deploy → Run workflow (เช่น deploy ซ้ำหลังแก้ปัญหาบน VM)
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [refactor]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - name: SSH เข้า VM แล้วรัน deploy/deploy.sh
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_APP_DIR: ${{ secrets.VM_APP_DIR }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy "$VM_USER@$VM_HOST" "cd '${VM_APP_DIR:-~/ise-kmitlMap}' && ./deploy/deploy.sh"
